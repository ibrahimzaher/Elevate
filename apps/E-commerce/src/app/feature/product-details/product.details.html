@if (isLoading()) {
<div class="flex flex-col gap-12 sm:gap-16">
  <div class="grid grid-cols-1 items-start gap-8 sm:gap-10 lg:grid-cols-2 lg:gap-12">
    <div class="h-[19rem] sm:h-[24rem] lg:h-[25rem] w-full rounded-2xl bg-zinc-200 dark:bg-zinc-800 animate-pulse"></div>
    <div class="h-[25rem] w-full rounded-2xl bg-zinc-200 dark:bg-zinc-800 animate-pulse"></div>
  </div>
</div>
} @else if (product()) {
<section class="flex flex-col gap-12 sm:gap-16">
  <div class="grid grid-cols-1 items-start gap-8 sm:gap-10 lg:grid-cols-2 lg:gap-12">
    <app-product-gallery [product]="product()" />

    <app-product-info [product]="product()" (addToCart)="handleAddToCart($event)"
      (toggleWishlist)="handleToggleWishlist($event)" />
  </div>
  @defer (on viewport) {
  <app-product-reviews [reviews]="reviews()" />
  } @placeholder {
  <div class="h-32"></div>
  }
  @defer (on viewport) {
  <app-related-product [products]="relatedProducts()" />
  } @placeholder {
  <div class="h-32"></div>
  }
</section>
}
